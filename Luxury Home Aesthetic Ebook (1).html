                image: 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=800&q=80'

            {

                chapter: 'Bonus Section',
                title: 'Bathroom Spa Transformation',
                text: 'Turning your daily bathroom routine into a luxury ritual:',
                highlights: ['Rolling Turkish cotton towels in baskets', 'Adding eucalyptus stems to the showerhead', 'Using matching amber pump dispensers for toiletries'],
                image: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=800&q=80'
            },
            // Page 40
            {
                type: 'backcover',
                chapter: 'Conclusion',
                title: 'Your Home, Elevated',
                text: 'True luxury is creating a sanctuary that reflects your lifestyle, personality, and inner peace.<br><br>Thank you for exploring <em>Luxury Home Aesthetic on a Budget</em> by Oluchi.',
                image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80',
                badge: 'End of E-Book'
            }
        ];

        let currentPage = 0;
        let isDarkMode = false;

        function renderPage() {
            const page = ebookPages[currentPage];
            const container = document.getElementById('page-content');
            
            // Update Progress Bar & indicators
            const progress = ((currentPage + 1) / ebookPages.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-indicator').innerText = `Page ${currentPage + 1} of ${ebookPages.length}`;
            document.getElementById('mobile-page-indicator').innerText = `${currentPage + 1} / ${ebookPages.length}`;

            // Button states
            document.getElementById('prev-btn').disabled = currentPage === 0;
            document.getElementById('next-btn').disabled = currentPage === ebookPages.length - 1;

            // Render specific page templates
            if (page.type === 'cover') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-full my-auto">
                        <div class="flex flex-col justify-center space-y-6 text-left">
                            <span class="text-xs uppercase tracking-widest bg-luxury-gold/20 text-luxury-gold px-3 py-1.5 rounded-full w-max font-semibold">${page.badge}</span>
                            <h1 class="text-4xl sm:text-5xl font-serif font-bold text-luxury-dark leading-tight">${page.title}</h1>
                            <p class="text-luxury-earth text-base sm:text-lg leading-relaxed">${page.subtitle}</p>
                            <div class="pt-4 border-t border-luxury-sand flex items-center space-x-4">
                                <div class="w-10 h-10 rounded-full bg-luxury-gold flex items-center justify-center text-white font-serif font-bold">O</div>
                                <div>
                                    <p class="font-serif font-semibold text-luxury-dark">${page.author}</p>
                                    <p class="text-xs text-luxury-earth uppercase tracking-wider">Interior Design Playbook</p>
                                </div>
                            </div>
                        </div>
                        <div class="relative h-72 sm:h-[450px] rounded-xl overflow-hidden shadow-xl">
                            <img src="${page.image}" alt="Luxury Cover" class="w-full h-full object-cover transform hover:scale-105 transition duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark/40 to-transparent"></div>
                        </div>
                    </div>
                `;
            } else if (page.type === 'copyright') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-full my-auto">
                        <div class="relative h-64 sm:h-[400px] rounded-xl overflow-hidden shadow-md">
                            <img src="${page.image}" alt="Copyright" class="w-full h-full object-cover">
                        </div>
                        <div class="space-y-6">
                            <span class="text-xs uppercase tracking-widest text-luxury-gold font-semibold">${page.chapter}</span>
                            <h2 class="text-3xl font-serif font-bold text-luxury-dark">${page.title}</h2>
                            <div class="text-luxury-earth text-sm sm:text-base leading-relaxed space-y-4">
                                <p>${page.content}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (page.type === 'toc_intro') {
                let listHtml = page.items.map(item => `<li class="py-2 text-sm sm:text-base text-luxury-dark font-medium flex items-center space-x-3"><span class="w-2 h-2 rounded-full bg-luxury-gold"></span><span>${item}</span></li>`).join('');
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-full my-auto">
                        <div class="space-y-6">
                            <span class="text-xs uppercase tracking-widest text-luxury-gold font-semibold">${page.chapter}</span>
                            <h2 class="text-3xl font-serif font-bold text-luxury-dark">${page.title}</h2>
                            <ul class="space-y-1">${listHtml}</ul>
                        </div>
                        <div class="relative h-64 sm:h-[400px] rounded-xl overflow-hidden shadow-md">
                            <img src="${page.image}" alt="Table of Contents" class="w-full h-full object-cover">
                        </div>
                    </div>
                `;
            } else if (page.type === 'backcover') {
                container.innerHTML = `
                    <div class="text-center max-w-2xl mx-auto my-auto space-y-8 py-12">
                        <span class="text-xs uppercase tracking-widest bg-luxury-gold/20 text-luxury-gold px-4 py-1.5 rounded-full font-semibold">${page.badge}</span>
                        <h1 class="text-4xl font-serif font-bold text-luxury-dark">${page.title}</h1>
                        <div class="rounded-xl overflow-hidden shadow-lg h-64 max-w-md mx-auto">
                            <img src="${page.image}" alt="Back Cover" class="w-full h-full object-cover">
                        </div>
                        <p class="text-luxury-earth text-base sm:text-lg leading-relaxed">${page.text}</p>
                        <button onclick="goToPage(0)" class="bg-luxury-dark text-luxury-cream hover:bg-luxury-gold px-8 py-3 rounded-full text-sm font-semibold tracking-wider transition shadow">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Read Again from Beginning
                        </button>
                    </div>
                `;
            } else {
                // Standard page layout with image and text/points/highlights
                let pointsHtml = page.points ? page.points.map(p => `
                    <div class="flex items-start space-x-3 bg-luxury-sand/40 p-3 rounded-lg border border-luxury-sand">
                        <i class="fa-solid fa-check text-luxury-gold mt-1"></i>
                        <div>
                            <h4 class="font-serif font-bold text-luxury-dark text-sm sm:text-base">${p.title}</h4>
                            <p class="text-xs sm:text-sm text-luxury-earth mt-0.5">${p.desc}</p>
                        </div>
                    </div>
                `).join('') : '';

                let highlightsHtml = page.highlights ? `
                    <div class="space-y-2 mt-4">
                        ${page.highlights.map(h => `<div class="flex items-center space-x-2 text-xs sm:text-sm text-luxury-earth font-medium"><i class="fa-solid fa-circle-chevron-right text-luxury-gold text-xs"></i><span>${h}</span></div>`).join('')}
                    </div>
                ` : '';

                let quoteHtml = page.quote ? `
                    <div class="mt-4 p-4 border-l-2 border-luxury-gold bg-luxury-sand/30 italic text-xs sm:text-sm text-luxury-dark font-serif">
                        "${page.quote}"
                    </div>
                ` : '';

                container.innerHTML = `
                    <div class="flex flex-col justify-between h-full my-auto space-y-6">
                        <div class="flex items-center justify-between border-b border-luxury-sand pb-3">
                            <span class="text-xs uppercase tracking-widest text-luxury-gold font-semibold">${page.chapter}</span>
                            <span class="text-xs font-serif text-luxury-earth italic">Page ${currentPage + 1}</span>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                            <div class="md:col-span-7 space-y-4">
                                <h2 class="text-2xl sm:text-3xl font-serif font-bold text-luxury-dark">${page.title}</h2>
                                ${page.text ? `<p class="text-luxury-earth text-sm sm:text-base leading-relaxed">${page.text}</p>` : ''}
                                ${pointsHtml ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">${pointsHtml}</div>` : ''}
                                ${highlightsHtml}
                                ${quoteHtml}
                            </div>
                            <div class="md:col-span-5">
                                <div class="relative h-60 sm:h-80 rounded-xl overflow-hidden shadow-lg border border-luxury-sand/50">
                                    <img src="${page.image}" alt="${page.title}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-luxury-sand/50 flex justify-between items-center text-xs text-luxury-earth">
                            <span>Luxury Home Aesthetic on a Budget</span>
                            <span>Oluchi</span>
                        </div>
                    </div>
                `;
            }
        }

        function nextPage() {
            if (currentPage < ebookPages.length - 1) {
                currentPage++;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToPage(index) {
            currentPage = index;
            renderPage();
            toggleTocModal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTocModal() {
            const modal = document.getElementById('toc-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                populateToc();
            }
        }

        function populateToc() {
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = ebookPages.map((page, idx) => `
                <div onclick="goToPage(${idx})" class="flex items-center justify-between py-2.5 px-3 hover:bg-luxury-sand rounded-lg cursor-pointer transition">
                    <span class="text-sm font-medium text-luxury-dark"><span class="text-luxury-gold font-bold mr-2">${idx + 1}.</span> ${page.title}</span>
                    <span class="text-xs text-luxury-earth bg-luxury-sand px-2 py-1 rounded">Page ${idx + 1}</span>
                </div>
            `).join('');
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const container = document.getElementById('magazine-container');
            const icon = document.getElementById('theme-icon');
            if (isDarkMode) {
                container.classList.remove('bg-luxury-cream', 'text-luxury-dark');
                container.classList.add('bg-[#1a1816]', 'text-luxury-cream');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                container.classList.remove('bg-[#1a1816]', 'text-luxury-cream');
                container.classList.add('bg-luxury-cream', 'text-luxury-dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        // Initial render on load
        window.onload = renderPage;
    </script>
</body>
